<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday gift</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="screen welcome" id="welcome-screen">
    <div class="welcome__card">

        <p class="welcome__symbol">☾</p>

        <h1>Feliz cumpleaños</h1>

        <p class="welcome__message">
            Preparé algo especial para ti...
        </p>

        <button class="welcome__button" id="start-button">
            Entrar
        </button>

    </div>
</main>
<main class="screen game hidden" id="game-screen">
    <div class="game__card">

        <p id="question-number"></p>

        <p id="score"></p>

        <h2 id="question-text"></h2>

        <p id="feedback"></p>

        <div id="memory" class="hidden">
            <p id="memory-text"></p>
        </div>

        <div id="answer-options"></div>

    </div>
</main>
    <script src="js/app.js"></script>
</body>
</html>
